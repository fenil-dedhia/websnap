openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Screenshot job operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    post:
      operationId: createJob
      tags: [jobs]
      summary: Start a screenshot job
      description: Submits a URL to begin link discovery and screenshotting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job status
      description: Returns current status and progress log for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a running job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/download:
    get:
      operationId: downloadJob
      tags: [jobs]
      summary: Download ZIP file for a completed job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP file stream
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: Job not found or not complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateJobRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to screenshot
        mode:
          type: string
          enum: [crawl, single]
          description: "crawl = full site capture (ZIP); single = one page PNG"
      required:
        - url
    JobLogEntry:
      type: object
      properties:
        timestamp:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [info, success, error, warning]
      required:
        - timestamp
        - message
        - type
    JobStatus:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed]
        screenshotCount:
          type: integer
        totalUrls:
          type: integer
        currentUrl:
          type: string
        log:
          type: array
          items:
            $ref: "#/components/schemas/JobLogEntry"
        downloadReady:
          type: boolean
        mode:
          type: string
          enum: [crawl, single]
        createdAt:
          type: string
        completedAt:
          type: string
      required:
        - id
        - url
        - status
        - screenshotCount
        - totalUrls
        - log
        - downloadReady
        - createdAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
